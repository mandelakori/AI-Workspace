objective = "Reconstruct this byte-stride argv utility in candidate.c. Its two arguments are text and decimal step. Preserve length limits, step validation, exact error output and exit codes. Read examples.json and analysis JSON for evidence. Run the approved compile check."
category = "native-stride"
source = "."
source_inputs = ["reference.c"]
binary = "reference.elf"
format = "ELF"
development = "development.json"
selectors = ["main"]
deliverables = ["candidate.c"]
attempts = 2
timeout = 240

[build_reference]
argv = ["gcc", "-std=c11", "-O0", "-fno-inline", "reference.c", "-o", "reference.elf"]

[reference]
argv = ["./reference.elf"]
timeout = 12

[build_candidate]
argv = ["gcc","-std=c11","-O2","candidate.c","-o","candidate"]

[candidate]
argv = ["./candidate"]
timeout = 12
